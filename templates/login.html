{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-logo">
        <img src="{{ url_for('static', filename='images/university-logo.png') }}" alt="University Logo">
    </div>
    <div class="card form-card">
        <h2>Login to Quiz Portal</h2>
        <form method="POST">
            <label>Login ID</label>
            <input type="text" name="login_id" required placeholder="UUCMS ID (Student) or Email (Teacher)">

            <label>Password</label>
            <div class="password-field">
                <input type="password" name="password" id="login-password" required placeholder="••••••••">
                <button type="button" class="password-toggle" onclick="togglePassword('login-password', this)" aria-label="Show password">👁️</button>
            </div>

            <button class="btn btn-block" type="submit">Login</button>
        </form>
        <p>No account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</div>
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? "👁️" : "🙈";
        btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    }
</script>
{% endblock %}
