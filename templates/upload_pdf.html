{% extends "base.html" %}
{% block title %}Auto Quiz from PDF{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>Generate Quiz Automatically from PDF Notes</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>Quiz Title</label>
        <input type="text" name="title" required placeholder="e.g. Chapter 3 - Photosynthesis">

        <label>Upload PDF Notes</label>
        <input type="file" name="pdf_file" accept="application/pdf" required>

        <label>Number of questions to generate from PDF (pool size)</label>
        <input type="number" name="num_questions" value="15" min="5" max="100">

        <label>Questions shown per student attempt</label>
        <input type="number" name="questions_per_attempt" value="10" min="1" max="100">

        <label>Time limit (minutes)</label>
        <input type="number" name="duration_minutes" value="15" min="1" max="180">

        <label>Quiz Password <span class="muted">(optional — students must enter this before starting)</span></label>
        <input type="text" name="quiz_password" placeholder="Leave blank for no password">

        <button class="btn btn-block" type="submit">Generate Quiz</button>
    </form>
    <p class="muted">Tip: the pool size should be bigger than "questions per attempt" so each
    student gets a different random subset and order.</p>
</div>
{% endblock %}
