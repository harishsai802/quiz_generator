{% extends "base.html" %}
{% block title %}Enter Quiz Password{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>🔒 {{ quiz.title }}</h2>
    <p class="muted">This quiz is protected. Ask your faculty for the quiz password to continue.</p>
    <form method="POST">
        <label>Quiz Password</label>
        <input type="password" name="quiz_password" required autofocus>
        <button class="btn btn-block" type="submit">Unlock &amp; Start Quiz</button>
    </form>
</div>
{% endblock %}
