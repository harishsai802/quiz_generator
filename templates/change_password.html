{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>Change Password</h2>
    {% if session.get('must_change_password') %}
    <p class="muted">You're logging in with an auto-generated password. Please set your own password to continue.</p>
    {% endif %}
    <form method="POST">
        <label>Current Password</label>
        <input type="password" name="current_password" required>

        <label>New Password</label>
        <input type="password" name="new_password" required minlength="4">

        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="4">

        <button class="btn btn-block" type="submit">Update Password</button>
    </form>
</div>
{% endblock %}
