{% extends "base.html" %}
{% block title %}Edit Quiz{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>Edit Quiz</h2>
    <form method="POST">
        <label>Quiz Title</label>
        <input type="text" name="title" value="{{ quiz.title }}" required>

        <label>Class / Section</label>
        <select name="class_id">
            <option value="">All Classes (everyone can see this quiz)</option>
            {% for c in classes %}
            <option value="{{ c.id }}" {% if quiz.class_id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>

        <label>Questions shown per student attempt</label>
        <input type="number" name="questions_per_attempt" value="{{ quiz.questions_per_attempt }}" min="1" max="100">

        <label>Time limit (minutes)</label>
        <input type="number" name="duration_minutes" value="{{ quiz.duration_minutes }}" min="1" max="180">

        <label>
            {% if quiz.access_password %}
                Quiz Password <span class="muted">(a password is currently set — enter a new value to change it)</span>
            {% else %}
                Quiz Password <span class="muted">(optional — students must enter this before starting)</span>
            {% endif %}
        </label>
        <input type="text" name="quiz_password" placeholder="Leave blank to keep current setting">

        {% if quiz.access_password %}
        <label class="checkbox-label">
            <input type="checkbox" name="remove_password"> Remove password protection from this quiz
        </label>
        {% endif %}

        <button class="btn btn-block" type="submit">Save Changes</button>
    </form>
</div>

<div class="card form-card" style="border-left:4px solid var(--maroon);">
    <h3>Danger Zone</h3>
    <p class="muted">Deleting a quiz permanently removes its questions, student attempts, and violation records.</p>
    <form method="POST" action="{{ url_for('delete_quiz', quiz_id=quiz.id) }}"
          onsubmit="return confirm('Delete \'{{ quiz.title }}\'? This cannot be undone and will remove all related questions, attempts, and violation records.');">
        <button class="btn btn-danger" type="submit">Delete This Quiz</button>
    </form>
</div>
{% endblock %}
